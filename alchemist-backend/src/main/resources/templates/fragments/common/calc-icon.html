<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>調合方法アイコン</title>
  </head>
  <body>
    <div
      th:fragment="calcIcon(calcType,class)"
      th:with="Calc=${T(com.example.app.domain.enums.CalculationType)}, cssClass=${class ?: 'size-4'}"
      class="js-calc-icon"
      th:classappend="${cssClass}"
      th:attr="data-calc-type=${calcType}"
    >
      <span th:if="${calcType == Calc.ADD}">+</span>
      <span th:if="${calcType == Calc.MULTIPLY}">×</span>
      <span th:if="${calcType == Calc.MODULO}">%</span>
    </div>
  </body>
</html>
