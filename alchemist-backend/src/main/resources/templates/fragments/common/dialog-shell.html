<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>コモンダイアログ</title>
  </head>
  <body>
    <div
      th:fragment="dialogShell"
      id="dialogShell"
      class="fixed inset-0 hidden items-center justify-center bg-black/50 p-4 z-50"
    >
      <!-- pixel-dialog-box を適用 -->
      <div class="pixel-dialog-box text-center flex flex-col gap-6">
        <div id="dialogContent">
          <!-- ここに中身がJSで差し込まれる -->
        </div>

        <!-- justify-center gap-4 に変更することで、1つでも2つでも綺麗な配置に -->
        <div class="flex justify-center gap-4 w-full">
          <button
            type="button"
            id="dialogNegativeButton"
            class="pixel-btn-dialog-negative"
          >
            キャンセル
          </button>
          <button
            type="button"
            id="dialogPositiveButton"
            class="pixel-btn-dialog-positive"
          >
            決定
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
