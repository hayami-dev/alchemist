<!-- fragments/alchemy/error-modal.html -->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>エラー</title>
  </head>
  <body>
    <div
      th:fragment="errorModal(message)"
      class="pixel-dialog-content whitespace-pre"
    >
      <p
        class="pixel-dialog-message whitespace-pre-line"
        th:text="${message}"
      ></p>
    </div>
  </body>
</html>
