<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プライマリーボタン</title>
  </head>
  <body>
    <button
      th:fragment="primaryButton(type,text)"
      th:type="${type}"
      class="bg-blue-600 text-white text-2xl py-2 px-4 rounded-full hover:opacity-80"
    >
      [[${text}]]
    </button>
  </body>
</html>
