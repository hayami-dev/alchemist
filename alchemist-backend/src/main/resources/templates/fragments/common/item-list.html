<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アイテムリスト</title>
  </head>
  <body>
    <div
      th:fragment="itemList(itemData,quantity,price)"
      class="js-item-list-button flex gap-4 border-1 border-amber-800"
      th:data-item-id="${itemData.item.id}"
    >
      <div
        th:replace="~{fragments/common/item-name :: itemName(${itemData})}"
      ></div>
      <div class="flex gap-4" th:if="${price != null or quantity != null}">
        <p th:if="${price != null}">[[${price}]] G</p>
        <p th:if="${quantity != null}">×[[${quantity}]]</p>
      </div>
    </div>
  </body>
</html>
