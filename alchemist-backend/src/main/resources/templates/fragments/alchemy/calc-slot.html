<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>調合方法スロット</title>
  </head>
  <body>
    <button
      type="button"
      th:data-slot-num="${num}"
      th:fragment="calcSlot(num, selectedType, allCalcTypes)"
      class="js-calc-slot-button size-icon-sm pixel-btn-diamond-teal"
    >
      <th:block th:each="calcType: ${allCalcTypes}">
        <div
          th:replace="~{fragments/common/calc-icon :: calcIcon(${calcType}, ${calcType == selectedType} ? '' : 'hidden')}"
        ></div>
      </th:block>
    </button>
  </body>
</html>
