<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>調合方法スロット</title>
  </head>
  <body>
    <button
      type="button"
      th:data-slot-num="${num}"
      th:fragment="calcSlot(num)"
      class="js-calc-slot-button size-icon-md border border-amber-950 bg-amber-100 text-amber-950 text-xs rounded-3xl flex items-center justify-center hover:opacity-80"
    >
      <span>方法[[${num}]]</span>
      <div
        th:replace="~{fragments/common/calc-icon :: calcIcon(${selectedType})}"
      ></div>
    </button>
  </body>
</html>
