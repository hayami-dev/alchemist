<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>調合方法のピッカー</title>
  </head>
  <body>
    <div th:fragment="calcPicker">
      <ul>
        <th:block th:each="calcType : ${unlockedCalcTypes}">
          <li>
            <button
              type="button"
              th:data-calc-type="${calcType}"
              class="js-calc-picker-button"
            >
              <div
                th:replace="~{fragments/common/calc-icon :: calcIcon(${calcType})}"
              ></div>
            </button>
          </li>
        </th:block>
      </ul>
    </div>
  </body>
</html>
