<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マテリアルアイテムピッカー</title>
  </head>
  <body>
    <div th:fragment="materialPicker">
      <ul>
        <th:block th:each="inventoryItem : ${items}">
          <li th:text="${inventoryItem.item.name}"></li>
          <li th:text="${inventoryItem.quantity}"></li>
        </th:block>
      </ul>
    </div>
  </body>
</html>
