<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header
      th:fragment="header"
      class="flex items-center gap-6 justify-between py-4 px-8"
    >
      <div>
        <button
          class="pixel-btn-circle-orange text-xs"
          th:onclick="|location.href='@{/}'|"
        >
          <span class="p-2"> ホームへ </span>
        </button>
      </div>
      <!-- TODO:所持ゴールドの実装 -->
      <!-- <div>1000 G</div> -->
      <div>
        <nav class="flex gap-8">
          <!-- レシピボタン -->
          <button
            type="button"
            class="pixel-btn-capsule-cream relative pl-8 pr-6"
            th:onclick="|location.href='@{/catalog}'|"
          >
            <img
              th:src="@{/images/recipe-nav.png}"
              alt="レシピ"
              class="absolute w-[50px] top-1/2 -translate-y-1/2 left-[-10px] z-[10] pointer-events-none"
            />
            <span>レシピ</span>
          </button>

          <!-- バッグボタン -->
          <button
            type="button"
            class="pixel-btn-capsule-cream relative pl-10 pr-6"
            th:onclick="|location.href='@{/inventory}'|"
          >
            <img
              th:src="@{/images/bag-nav.png}"
              alt="バッグ"
              class="absolute w-[50px] top-1/2 -translate-y-1/2 left-[-10px] z-[10] pointer-events-none"
            />
            <span>バッグ</span>
          </button>
          <!-- TODO:ショップの実装 -->
        </nav>
      </div>
    </header>
  </body>
</html>
