<!doctype html>
<html
  lang="ja"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title layout:title-pattern="$CONTENT_TITLE | Recipe for dreams">
      ベースページ
    </title>
    <!-- TailwindCSS、ベースCSSの読み込み -->
    <link rel="stylesheet" th:href="@{/css/output.css}" />
  </head>
  <body class="flex flex-col min-h-dvh justify-between">
    <header th:replace="~{fragments/layout/header :: header}"></header>
    <main layout:fragment="content">
      <!-- ここに各ページの中身が差し込まれる -->
    </main>
    <footer th:replace="~{fragments/layout/footer :: footer}"></footer>
    <!-- ダイアログ -->
    <div th:replace="~{fragments/common/dialog-shell :: dialogShell}"></div>
    <script type="module" th:src="@{/js/services/dialogService.js}"></script>
  </body>
</html>
