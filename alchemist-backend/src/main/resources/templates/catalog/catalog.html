<!doctype html>
<html
  lang="ja"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/base}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>レシピ</title>
  </head>
  <body class="page-atelier">
    <main layout:fragment="content" class="flex flex-col gap-8 items-center">
      <h1>レシピ</h1>
      <div class="grid grid-cols-12 gap-12">
        <!-- アイテムカラム -->
        <div class="col-span-10">
          <ul class="grid grid-cols-6 gap-8">
            <th:block th:each="slot: ${slots}">
              <li
                th:if="${slot.isCataloged}"
                class="pixel-btn-circle-orange-light col-autoborder-amber-800"
              >
                <span> [[${slot.item.name}]] </span>
              </li>
              <li
                th:if="${!slot.isCataloged}"
                class="pixel-btn-circle-gray-disabled col-auto"
              >
                <span> ？ </span>
              </li>
            </th:block>
          </ul>
        </div>
        <!-- 達成率 -->
        <div class="col-span-2 pixel-rate-card h-fit">
          <p>達成率</p>
          <p>[[${completionRate}]]%</p>
        </div>
      </div>
    </main>
  </body>
</html>
