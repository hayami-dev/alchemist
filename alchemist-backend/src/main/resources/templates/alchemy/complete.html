<!doctype html>
<html
  lang="ja"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/base}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>調合完了！</title>
  </head>
  <body class="page-alchemy">
    <div
      layout:fragment="content"
      class="flex flex-col items-center justify-center gap-8"
    >
      <section class="w-full">
        <div
          class="flex flex-col items-center justify-center gap-8 bg-[rgba(255,255,255,0.6)] p-8"
        >
          <h1 class="text-2xl font-bold">調合結果</h1>
          <div id="resultItemName" class="text-xl"></div>
          <!-- <div id="resultItemDescription" class="text-sm text-gray-600"></div> -->
        </div>
      </section>
      <button
        type="button"
        class="pixel-btn-oval-back"
        th:onclick="|location.href='@{/alchemy}'|"
      >
        ＜ もういちど調合台へ
      </button>
      <script type="module" th:src="@{/js/alchemy/complete.js}"></script>
    </div>
  </body>
</html>
