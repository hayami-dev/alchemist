<!doctype html>
<html
  lang="ja"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/base}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>調合台</title>
  </head>

  <body>
    <div layout:fragment="content">
      <section class="flex flex-col gap-4 items-center">
        <h1 class="text-2xl font-bold">調合</h1>
        <p>素材を2つ以上選んでください。</p>
        <form class="flex flex-col gap-4 items-center">
          <div class="flex gap-6 items-center p-6 justify-center">
            <div
              th:replace="~{fragments/alchemy/material-slot :: materialSlot(1)}"
            ></div>
            <div
              th:replace="~{fragments/alchemy/calc-slot :: calcSlot(1, ${defaultCalcType}, ${allCalcTypes})}"
            ></div>
            <div
              th:replace="~{fragments/alchemy/material-slot :: materialSlot(2)}"
            ></div>
            <div
              th:replace="~{fragments/alchemy/calc-slot :: calcSlot(2, ${defaultCalcType}, ${allCalcTypes})}"
            ></div>
            <div
              th:replace="~{fragments/alchemy/material-slot :: materialSlot(3)}"
            ></div>
          </div>
          <button
            th:replace="~{fragments/common/primary-button :: primaryButton('submit','調合する')}"
          ></button>
        </form>
      </section>
      <script type="module" th:src="@{/js/alchemy.js}"></script>
    </div>
  </body>
</html>
