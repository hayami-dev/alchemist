spring.application.name=alchemist-backend
# データベース接続設定
spring.datasource.url=jdbc:mysql://db:3306/alchemist_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
spring.datasource.username=game_user
spring.datasource.password=game_password
# MyBatisの設定
# mybatis.mapper-locations=classpath*:/mybatis/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# SQLログを出力する（デバッグ用）
logging.level.com.example.app.mapper=DEBUG
# 接続ドライバの明示（最近のSpring Bootなら自動だけど念のため）
